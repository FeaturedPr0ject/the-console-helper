name: Build Native CMD Host

on:
  push:
    branches: [main]
    paths:
      - "native-host/**"
      - ".github/workflows/build-native-cmd-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows x64 host
        run: dotnet publish native-host/ServerTrace.NativeHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload native host artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerTrace-NativeHost-win-x64
          path: publish/ServerTrace.NativeHost.exe
          if-no-files-found: error
