name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "src/ServerTrace/**"
      - ".github/workflows/build-windows.yml"
      - "build-windows.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file Windows x64 EXE
        run: dotnet publish src/ServerTrace/ServerTrace.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerTrace-win-x64
          path: publish/ServerTrace.exe
          if-no-files-found: error